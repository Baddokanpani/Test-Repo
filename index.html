<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-98BKGLW8SP"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-98BKGLW8SP');
</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rico's Cook Book</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="data_content.js" defer></script>
</head>
<body>
  <!-- HEADER SECTION -->
  <header>
    <img src="https://png.pngtree.com/png-vector/20220727/ourmid/pngtree-cooking-logo-png-image_6089722.png" alt="Rico's Cook Book Logo" class="logo">
    <h1>Rico's Cook Book!</h1>
  </header>

  <!-- LEFT SIDEBAR: Adjustments Section -->
  <section class="left">
    <h2>Adjustments</h2>
    <p>Prep Time: <span id="prep-time">--</span> minutes</p>
    <p>Cook Time: <span id="cook-time">--</span> minutes</p>
    <div class="serving-adjustment">
      <label for="sidebar-serving-selector">Servings:</label>
      <input type="number" id="sidebar-serving-selector" min="1" max="20" value="">
    </div>
    
    <!-- Ingredients in Sidebar -->
    <div id="sidebar-ingredients-container"></div>
  </section>

  <!-- MAIN CONTENT SECTION -->
  <main>
    <!-- Recipe Template -->
    <template id="recipe-template">
      <div class="recipe">
        <h3 class="recipe-title"></h3>
        <img class="recipe-image" src="" alt="">
        <p class="recipe-description"></p>
        <div class="recipe-instructions">
          <h4>Instructions</h4>
          <div class="instructions-text"></div>
        </div>
      </div>
    </template>

    <!-- Recipe Display Container -->
    <div id="recipe-container"></div>
  </main>

  <!-- RIGHT SIDEBAR: Recipe List -->
  <section class="right">
    <h2>Recipes</h2>
    <div id="recipe-buttons"></div>
  </section>

  <!-- FOOTER: Contact & Suggestion Box -->
  <footer>
    <p>Contact: rico.tru.suave@gmail.com</p>
    <form action="https://formspree.io/f/mbdqbyyb" method="POST">
      <label for="suggestion-email">Email</label>
      <input type="email" id="suggestion-email" name="email" required placeholder="your@email.com" />
      <label for="suggestion-box">Suggestion Box:</label>
      <textarea id="suggestion-box" name="message" rows="3" required placeholder="Leave your suggestions here..."></textarea>
      <input type="hidden" name="_subject" value="New cookbook suggestion" />
      <button type="submit">Submit</button>
    </form>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const sidebarIngredientsContainer = document.getElementById("sidebar-ingredients-container");
      const recipeContainer = document.getElementById("recipe-container");
      const recipeTemplate = document.getElementById("recipe-template").content;
      const buttonsContainer = document.getElementById("recipe-buttons");

      const prepSpan = document.getElementById("prep-time");
      const cookSpan = document.getElementById("cook-time");

      let currentRecipe = null;
      let currentServingSize = null;
      const servingSelector = document.getElementById("sidebar-serving-selector");

      function formatQuantity(quantity) {
        // Convert decimals to fractions for better readability
        const fractions = {
          0.25: "¼",
          0.33: "⅓",
          0.5: "½",
          0.66: "⅔",
          0.75: "¾"
        };

        const decimal = quantity % 1;
        const whole = Math.floor(quantity);

        for (let key in fractions) {
          if (Math.abs(decimal - key) < 0.01) {
            return whole > 0 ? `${whole} ${fractions[key]}` : fractions[key];
          }
        }

        return quantity % 1 === 0 ? whole.toString() : quantity.toFixed(2);
      }

      function displayIngredients(recipe, servingSize) {
        sidebarIngredientsContainer.innerHTML = "";
        
        const ingredientsDiv = document.createElement("div");
        ingredientsDiv.className = "sidebar-ingredients-section";
        
        const title = document.createElement("h3");
        title.textContent = "Ingredients";
        ingredientsDiv.appendChild(title);
        
        const ingredientsList = document.createElement("ul");
        ingredientsList.className = "ingredients-list";

        // Calculate scaling factor
        const scaleFactor = servingSize / recipe.servings;

        // Display each ingredient
        recipe.ingredients.forEach((ingredient) => {
          const li = document.createElement("li");
          
          // Check if ingredient is "to taste"
          if (ingredient.toTaste) {
            li.textContent = ingredient.name;
          } else {
            const scaledQuantity = ingredient.quantity * scaleFactor;
            const displayQuantity = formatQuantity(scaledQuantity);
            li.textContent = `${displayQuantity} ${ingredient.unit} ${ingredient.name}`;
          }
          
          ingredientsList.appendChild(li);
        });

        ingredientsDiv.appendChild(ingredientsList);
        sidebarIngredientsContainer.appendChild(ingredientsDiv);
      }

      function processInstructions(recipe, servingSize) {
        const scaleFactor = servingSize / recipe.servings;
        
        // Create a map of ingredient names to scaled quantities
        const ingredientMap = {};
        recipe.ingredients.forEach((ingredient) => {
          if (ingredient.toTaste) {
            ingredientMap[ingredient.name] = ingredient.name;
          } else {
            const scaledQuantity = ingredient.quantity * scaleFactor;
            const displayQuantity = formatQuantity(scaledQuantity);
            ingredientMap[ingredient.name] = `${displayQuantity} ${ingredient.unit}`;
          }
        });
        
        // Process each instruction and replace ingredient names with quantities
        return recipe.instructions.map((instruction) => {
          let processedInstruction = instruction;
          
          // Replace ingredient names with their scaled quantities
          Object.keys(ingredientMap).forEach((ingredientName) => {
            // Match ingredient names (case-sensitive based on how they appear in instructions)
            const regex = new RegExp(`\\b${ingredientName}\\b`, 'g');
            processedInstruction = processedInstruction.replace(regex, ingredientMap[ingredientName]);
          });
          
          return processedInstruction;
        });
      }

      function updateAdjustments(recipe, servingSize) {
        const scaleFactor = servingSize / recipe.servings;
        const scaledPrepTime = Math.round(recipe.prepTime * scaleFactor);

        // Update sidebar displays (prep time scales, cook time doesn't)
        prepSpan.textContent = scaledPrepTime;
        cookSpan.textContent = recipe.cookTime;
        servingSelector.value = servingSize;
      }

      function loadRecipe(recipe) {
        currentRecipe = recipe;
        currentServingSize = recipe.servings;

        // Display ingredients in sidebar
        displayIngredients(recipe, currentServingSize);

        // Display recipe details
        recipeContainer.innerHTML = "";
        const clone = recipeTemplate.cloneNode(true);
        clone.querySelector(".recipe-title").textContent = recipe.name;
        clone.querySelector(".recipe-image").src = recipe.image;
        clone.querySelector(".recipe-image").alt = recipe.name;
        clone.querySelector(".recipe-description").textContent = recipe.description;
        
        // Populate instructions with ingredient quantities
        const instructionsText = clone.querySelector(".instructions-text");
        const processedInstructions = processInstructions(recipe, currentServingSize);
        
        // Create flowing paragraph text from instructions
        let instructionHTML = "";
        processedInstructions.forEach((instruction, index) => {
          instructionHTML += `<p><strong>Step ${index + 1}:</strong> ${instruction}</p>`;
        });
        instructionsText.innerHTML = instructionHTML;
        
        recipeContainer.appendChild(clone);

        // Update left sidebar with adjustments
        updateAdjustments(recipe, currentServingSize);
      }

      // Populate buttons
      contentData.forEach((recipe) => {
        const btn = document.createElement("button");
        btn.textContent = recipe.name;
        btn.addEventListener("click", () => loadRecipe(recipe));
        buttonsContainer.appendChild(btn);
      });

      // Load the first recipe by default
      if (contentData.length > 0) {
        loadRecipe(contentData[0]);
      }

      // Add event listener to serving selector
      servingSelector.addEventListener("change", (e) => {
        const newServingSize = parseInt(e.target.value) || currentRecipe.servings;
        currentServingSize = newServingSize;
        displayIngredients(currentRecipe, currentServingSize);
        updateAdjustments(currentRecipe, currentServingSize);
        
        // Update instructions with new ingredient quantities
        const instructionsText = document.querySelector(".instructions-text");
        const processedInstructions = processInstructions(currentRecipe, currentServingSize);
        let instructionHTML = "";
        processedInstructions.forEach((instruction, index) => {
          instructionHTML += `<p><strong>Step ${index + 1}:</strong> ${instruction}</p>`;
        });
        instructionsText.innerHTML = instructionHTML;
      });
    });
  </script>
</body>
</html>
