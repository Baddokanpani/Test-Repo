<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rico's Cook Book</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="data_content.js" defer></script>
</head>
<body>
  <!-- HEADER SECTION -->
  <header>
    <img src="https://png.pngtree.com/png-vector/20220727/ourmid/pngtree-cooking-logo-png-image_6089722.png" alt="Rico's Cook Book Logo" class="logo">
    <h1>Rico's Cook Book!</h1>
  </header>

  <!-- LEFT SIDEBAR: Adjustments Section -->
  <section class="left">
    <h2>Adjustments</h2>
    <p>Prep Time: <span id="prep-time">--</span> minutes</p>
    <p>Cook Time: <span id="cook-time">--</span> minutes</p>
    <p>Servings: <span id="servings">--</span></p>
  </section>

  <!-- MAIN CONTENT SECTION -->
  <main>
    <!-- Recipe Template -->
    <template id="recipe-template">
      <div class="recipe">
        <h3 class="recipe-title"></h3>
        <img class="recipe-image" src="" alt="">
        <p class="recipe-description"></p>
      </div>
    </template>

    <!-- Recipe Display Container -->
    <div id="recipe-container"></div>
  </main>

  <!-- RIGHT SIDEBAR: Recipe List -->
  <section class="right">
    <h2>Recipes</h2>
    <div id="recipe-buttons"></div>
  </section>

  <!-- FOOTER: Contact & Suggestion Box -->
  <footer>
    <p>Contact: rico@example.com</p>
    <form>
      <label for="suggestion-box">Suggestion Box:</label>
      <textarea id="suggestion-box" rows="2" placeholder="Leave your suggestions here..."></textarea>
      <button type="submit">Submit</button>
    </form>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const container = document.getElementById("recipe-container");
      const template = document.getElementById("recipe-template").content;
      const buttonsContainer = document.getElementById("recipe-buttons");

      const prepSpan = document.getElementById("prep-time");
      const cookSpan = document.getElementById("cook-time");
      const servingsSpan = document.getElementById("servings");

      function loadRecipe(recipe) {
        container.innerHTML = ""; // Clear old content
        const clone = template.cloneNode(true);
        clone.querySelector(".recipe-title").textContent = recipe.name;
        clone.querySelector(".recipe-image").src = recipe.image;
        clone.querySelector(".recipe-image").alt = recipe.name;
        clone.querySelector(".recipe-description").textContent = recipe.description;
        container.appendChild(clone);

        // Update left sidebar
        prepSpan.textContent = recipe.prepTime;
        cookSpan.textContent = recipe.cookTime;
        servingsSpan.textContent = recipe.servings;
      }

      // Populate buttons
      contentData.forEach((recipe) => {
        const btn = document.createElement("button");
        btn.textContent = recipe.name;
        btn.addEventListener("click", () => loadRecipe(recipe));
        buttonsContainer.appendChild(btn);
      });

      // Load the first recipe by default
      if (contentData.length > 0) {
        loadRecipe(contentData[0]);
      }
    });
  </script>
</body>
</html>
