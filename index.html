<!DOCTYPE html>
<html lang="en">

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rico's Cook Book</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="data_content.js" defer></script>
</head>
<body>
  <!-- HEADER SECTION -->
  <header>
    <img src="https://png.pngtree.com/png-vector/20220727/ourmid/pngtree-cooking-logo-png-image_6089722.png" alt="Rico's Cook Book Logo" class="logo">
    <h1>Rico's Cook Book!</h1>
  </header>

  <!-- LEFT SIDEBAR: Adjustments Section -->
  <section class="left">
    <h2>Adjustments</h2>
    <p>Prep Time: <span id="prep-time">--</span> minutes</p>
    <p>Cook Time: <span id="cook-time">--</span> minutes</p>
    <p>Servings: <span id="servings">--</span></p>
  </section>

  <!-- MAIN CONTENT SECTION -->
  <main>
    <!-- Ingredients Template -->
    <template id="ingredients-template">
      <div class="ingredients-section">
        <div class="serving-controls">
          <label for="serving-selector">Servings:</label>
          <input type="number" id="serving-selector" min="1" max="20" value="">
        </div>
        <h3>Ingredients</h3>
        <ul class="ingredients-list"></ul>
      </div>
    </template>

    <!-- Recipe Template -->
    <template id="recipe-template">
      <div class="recipe">
        <h3 class="recipe-title"></h3>
        <img class="recipe-image" src="" alt="">
        <p class="recipe-description"></p>
      </div>
    </template>

    <!-- Ingredients Display Container -->
    <div id="ingredients-container"></div>

    <!-- Recipe Display Container -->
    <div id="recipe-container"></div>
  </main>

  <!-- RIGHT SIDEBAR: Recipe List -->
  <section class="right">
    <h2>Recipes</h2>
    <div id="recipe-buttons"></div>
  </section>

  <!-- FOOTER: Contact & Suggestion Box -->
  <footer>
    <p>Contact: rico@example.com</p>
    <form>
      <label for="suggestion-box">Suggestion Box:</label>
      <textarea id="suggestion-box" rows="2" placeholder="Leave your suggestions here..."></textarea>
      <button type="submit">Submit</button>
    </form>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const ingredientsContainer = document.getElementById("ingredients-container");
      const ingredientsTemplate = document.getElementById("ingredients-template").content;
      const recipeContainer = document.getElementById("recipe-container");
      const recipeTemplate = document.getElementById("recipe-template").content;
      const buttonsContainer = document.getElementById("recipe-buttons");

      const prepSpan = document.getElementById("prep-time");
      const cookSpan = document.getElementById("cook-time");
      const servingsSpan = document.getElementById("servings");

      let currentRecipe = null;
      let currentServingSize = null;

      function formatQuantity(quantity) {
        // Convert decimals to fractions for better readability
        const fractions = {
          0.25: "¼",
          0.33: "⅓",
          0.5: "½",
          0.66: "⅔",
          0.75: "¾"
        };

        const decimal = quantity % 1;
        const whole = Math.floor(quantity);

        for (let key in fractions) {
          if (Math.abs(decimal - key) < 0.01) {
            return whole > 0 ? `${whole} ${fractions[key]}` : fractions[key];
          }
        }

        return quantity % 1 === 0 ? whole.toString() : quantity.toFixed(2);
      }

      function displayIngredients(recipe, servingSize) {
        ingredientsContainer.innerHTML = "";
        const clone = ingredientsTemplate.cloneNode(true);
        const ingredientsList = clone.querySelector(".ingredients-list");
        const servingSelector = clone.querySelector("#serving-selector");

        // Set the serving selector to current value
        servingSelector.value = servingSize;

        // Calculate scaling factor
        const scaleFactor = servingSize / recipe.servings;

        // Display each ingredient
        recipe.ingredients.forEach((ingredient) => {
          const li = document.createElement("li");
          const scaledQuantity = ingredient.quantity * scaleFactor;
          const displayQuantity = formatQuantity(scaledQuantity);

          li.textContent = `${displayQuantity} ${ingredient.unit} ${ingredient.name}`;
          ingredientsList.appendChild(li);
        });

        // Update serving size in left sidebar
        servingsSpan.textContent = servingSize;

        // Add event listener to serving selector
        servingSelector.addEventListener("change", (e) => {
          const newServingSize = parseInt(e.target.value) || recipe.servings;
          displayIngredients(recipe, newServingSize);
        });

        ingredientsContainer.appendChild(clone);
      }

      function loadRecipe(recipe) {
        currentRecipe = recipe;
        currentServingSize = recipe.servings;

        // Display ingredients
        displayIngredients(recipe, currentServingSize);

        // Display recipe details
        recipeContainer.innerHTML = "";
        const clone = recipeTemplate.cloneNode(true);
        clone.querySelector(".recipe-title").textContent = recipe.name;
        clone.querySelector(".recipe-image").src = recipe.image;
        clone.querySelector(".recipe-image").alt = recipe.name;
        clone.querySelector(".recipe-description").textContent = recipe.description;
        recipeContainer.appendChild(clone);

        // Update left sidebar with times
        prepSpan.textContent = recipe.prepTime;
        cookSpan.textContent = recipe.cookTime;
      }

      // Populate buttons
      contentData.forEach((recipe) => {
        const btn = document.createElement("button");
        btn.textContent = recipe.name;
        btn.addEventListener("click", () => loadRecipe(recipe));
        buttonsContainer.appendChild(btn);
      });

      // Load the first recipe by default
      if (contentData.length > 0) {
        loadRecipe(contentData[0]);
      }
    });
  </script>
      }
    });
  </script>
</body>
</html>
